name: Profile widgets

# 3D 잔디 + snake 를 매일 다시 그려서 `output` 브랜치에 올린다.
# README 는 raw.githubusercontent.com/wlans01/wlans01/output/... 을 참조한다.
on:
  schedule:
    - cron: "0 15 * * *" # 매일 00:00 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/profile.yml"]

permissions:
  contents: write

concurrency:
  group: profile-widgets
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      # 3D 잔디 빌딩 (profile-3d-contrib/*.svg)
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 잔디 먹는 snake (다크/라이트)
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#39d353
            dist/snake.svg?palette=github-light&color_snake=#216e39

      # 회사(private) 레포 커밋은 API 가 레포별로 내주지 않아 언어 원그래프가
      # 공개 레포 몇 개만 반영한다 → 언어 원그래프·레이더 차트를 잘라낸다.
      - name: Strip language pie and radar
        run: node scripts/strip-charts.mjs profile-3d-contrib/profile-night-green.svg profile-3d-contrib/profile-green-animate.svg

      - name: Collect outputs
        run: |
          mkdir -p dist/3d
          cp profile-3d-contrib/profile-night-green.svg dist/3d/
          cp profile-3d-contrib/profile-green-animate.svg dist/3d/
          ls -la dist dist/3d

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore: update profile widgets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
